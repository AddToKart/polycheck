packages:
  - "shared"
  - "frontend"
  - "android"
  - "backend"
allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.11'
  - '@expo/inline-modules@0.1.4'
  - '@expo/local-build-cache-provider@57.0.5'
  - '@expo/log-box@57.0.2'
  - '@expo/metro-runtime@57.0.8'
  - '@expo/prebuild-config@57.0.10'
  - '@expo/ui@57.0.8'
  - babel-preset-expo@57.0.5
  - expo-asset@57.0.8
  - expo-constants@57.0.8
  - expo-image-picker@57.0.7
  - expo-location@57.0.7
  - expo-modules-core@57.0.8
  - expo-router@57.0.9
  - expo-sharing@57.0.8
  - expo@57.0.9
overrides:
  "@nestjs/swagger>js-yaml": 5.2.2
  "ajv>fast-uri": 3.1.4
  expo-constants: 57.0.8
  lightningcss: 1.30.1
  "minimatch@>=10.0.0>brace-expansion": 5.0.8
  "next>postcss": 8.5.25
  "next>sharp": 0.35.0
  "react-devtools-core>shell-quote": 1.9.0
