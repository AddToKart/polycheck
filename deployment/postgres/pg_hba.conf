# Polycheck's data network is internal and no PostgreSQL host port is published.
# All connections — including local Unix sockets — authenticate with SCRAM.
# Healthchecks inside the postgres container read the password from the
# mounted Compose secret file. The replication rule permits the scheduled
# pg_basebackup process to use the bootstrap PostgreSQL account over TCP.
local   all          all                              scram-sha-256
host    all          all          0.0.0.0/0           scram-sha-256
host    all          all          ::/0                scram-sha-256
host    replication  polycheck    0.0.0.0/0           scram-sha-256
host    replication  polycheck    ::/0                scram-sha-256
