name: Publish immutable release images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: production-images-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Resolve immutable image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          {
            echo "backend=ghcr.io/${repository}/backend"
            echo "frontend=ghcr.io/${repository}/frontend"
            echo "tag=sha-${RELEASE_SHA}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.images.outputs.backend }}:${{ steps.images.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.images.outputs.backend }}
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true
      - name: Publish frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '/api' }}
            NEXT_PUBLIC_ALLOW_QR_FALLBACKS=false
            NEXT_PUBLIC_PRIVACY_NOTICE_VERSION=${{ vars.PRIVACY_NOTICE_VERSION || '2026-08-04' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.images.outputs.frontend }}
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true
