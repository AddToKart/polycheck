name: Publish immutable release images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA on main to publish
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: production-images-${{ github.event.workflow_run.head_sha || inputs.release_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production-release
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.release_sha }}
    outputs:
      backend-image: ${{ steps.manifest.outputs.backend_image }}
      frontend-image: ${{ steps.manifest.outputs.frontend_image }}
      release-sha: ${{ steps.manifest.outputs.release_sha }}
    steps:
      - name: Verify release commit and successful CI
        uses: actions/github-script@v7
        env:
          REQUESTED_SHA: ${{ env.RELEASE_SHA }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const sha = process.env.REQUESTED_SHA
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('release_sha must be a full lowercase 40-character commit SHA')
              return
            }
            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            })
            const comparison = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: sha,
              head: main.data.commit.sha,
            })
            if (!['ahead', 'identical'].includes(comparison.data.status)) {
              core.setFailed(`${sha} is not contained in main`)
              return
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: sha,
              event: 'push',
              status: 'success',
              per_page: 10,
            })
            const trusted = runs.data.workflow_runs.find((run) =>
              run.head_branch === 'main' &&
              run.head_repository?.full_name === context.repo.owner + '/' + context.repo.repo)
            if (!trusted) core.setFailed(`No successful trusted CI push run exists for ${sha}`)
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Resolve immutable image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          {
            echo "backend=ghcr.io/${repository}/backend"
            echo "frontend=ghcr.io/${repository}/frontend"
            echo "tag=sha-${RELEASE_SHA}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.images.outputs.backend }}:${{ steps.images.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.images.outputs.backend }}
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true
      - name: Publish frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '/api' }}
            NEXT_PUBLIC_ALLOW_QR_FALLBACKS=false
            NEXT_PUBLIC_PRIVACY_NOTICE_VERSION=${{ vars.PRIVACY_NOTICE_VERSION || '2026-08-04' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.images.outputs.frontend }}
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true
      - name: Create digest-pinned deployment manifest
        id: manifest
        shell: bash
        env:
          BACKEND_REPOSITORY: ${{ steps.images.outputs.backend }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_REPOSITORY: ${{ steps.images.outputs.frontend }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          backend_image="${BACKEND_REPOSITORY}@${BACKEND_DIGEST}"
          frontend_image="${FRONTEND_REPOSITORY}@${FRONTEND_DIGEST}"
          {
            printf 'BACKEND_IMAGE=%s\n' "$backend_image"
            printf 'FRONTEND_IMAGE=%s\n' "$frontend_image"
            printf 'RELEASE_SHA=%s\n' "$RELEASE_SHA"
          } > deployment-images.env
          sha256sum deployment-images.env > deployment-images.env.sha256
          BACKEND_IMAGE="$backend_image" FRONTEND_IMAGE="$frontend_image" \
            sh deployment/scripts/validate-production-images.sh
          {
            echo "backend_image=$backend_image"
            echo "frontend_image=$frontend_image"
            echo "release_sha=$RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Immutable deployment images'
            echo
            printf '%s\n' "- Backend: \`$backend_image\`"
            printf '%s\n' "- Frontend: \`$frontend_image\`"
            echo
            echo 'Download the deployment-images artifact and verify its SHA-256 file before deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload deployment image manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployment-images-${{ env.RELEASE_SHA }}
          path: |
            deployment-images.env
            deployment-images.env.sha256
          if-no-files-found: error
          retention-days: 90
