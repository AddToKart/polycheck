name: polycheck_mobile
description: "Polycheck — PUP attendance management (Flutter mobile client)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State / routing
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  go_router: ^16.0.0

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  # Networking
  dio: ^5.8.0
  socket_io_client: ^3.0.0
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^2.7.0

  # Offline store
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.32

  # Crypto / secure storage
  cryptography: ^2.7.0
  flutter_secure_storage: ^10.0.0

  # In-class features (declared now; wired by feature waves)
  mobile_scanner: ^7.0.0
  geolocator: ^14.0.1
  permission_handler: ^12.0.0
  image_picker: ^1.2.0
  # Design system (Google Fonts: Lora display + DM Sans body)
  google_fonts: ^7.0.0

  # Sharing (documents, CSV, attachments)
  share_plus: ^13.3.1

  # Geofence map (OpenStreetMap tiles, no API key)
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Misc
  uuid: ^4.5.1
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_markdown: ^0.7.7+1
  qr_flutter: ^4.1.0
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # End-to-end harness (integration_test/*). SDK package — no pub dependency.
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.28.0
  riverpod_generator: ^4.0.0
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Android launcher icons (legacy + adaptive + Android 13 themed monochrome).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/branding/pup-logo-maroon.png"
  adaptive_icon_background: "#7B1113"
  adaptive_icon_foreground: "assets/branding/android-icon-foreground.png"
  adaptive_icon_monochrome: "assets/branding/android-icon-monochrome.png"
  min_sdk_android: 26
