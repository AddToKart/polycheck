name: Staging smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional HTTPS staging base URL; defaults to the staging environment variable
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment.environment == 'staging' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      STAGING_BASE_URL: ${{ inputs.base_url || vars.STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run read-only staging smoke checks
        run: node deployment/scripts/staging-smoke.mjs
