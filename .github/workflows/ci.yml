name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: polycheck_test
          POSTGRES_USER: polycheck
          POSTGRES_PASSWORD: polycheck-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polycheck -d polycheck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://polycheck:polycheck-test-password@localhost:5432/polycheck_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      EXPO_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - run: pnpm peers check
      - run: pnpm --dir android exec expo install --check
      - run: pnpm --filter @polycheck/backend prisma:generate
      - run: pnpm --filter @polycheck/backend prisma:migrate:deploy
      - run: pnpm --filter @polycheck/backend format:check
      - run: pnpm --filter @polycheck/backend lint:check
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend test:coverage
      - run: pnpm --filter @polycheck/shared build
      - run: pnpm --dir shared test
      - run: pnpm --filter @polycheck/backend build
      - run: pnpm --filter @polycheck/backend test:ci
      - run: pnpm --filter @polycheck/backend test:e2e
      - run: pnpm --dir frontend build
      - run: pnpm --dir android typecheck
      - run: pnpm --dir android test:coverage

  web-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: polycheck_test
          POSTGRES_USER: polycheck
          POSTGRES_PASSWORD: polycheck-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polycheck -d polycheck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://polycheck:polycheck-test-password@localhost:5432/polycheck_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      TRUST_PROXY: "false"
      STORAGE_DRIVER: local
      UPLOAD_DIR: /tmp/polycheck-uploads
      SEED_PASSWORD: PolycheckLocal1!
      PORT: "4000"
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      # The Playwright suite performs ~50 serialized logins; relax the default
      # identity/IP limits (10/30 per minute) to the docker-local values.
      LOGIN_RATE_LIMIT: "200"
      LOGIN_IP_RATE_LIMIT: "1000"
      API_RATE_LIMIT: "2000"
      API_RATE_WINDOW_SECONDS: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @polycheck/backend prisma:generate
      - run: pnpm --filter @polycheck/backend prisma:migrate:deploy
      - run: pnpm --filter @polycheck/backend prisma:seed
      - run: pnpm --filter @polycheck/backend build
      - name: Start backend
        run: |
          node backend/dist/main.js > backend.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:4000/api/health/ready > /dev/null 2>&1; then
              echo "Backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to become ready"
          cat backend.log
          exit 1
      - name: Build and start frontend
        run: |
          pnpm --dir frontend build
          pnpm --dir frontend start > frontend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login > /dev/null 2>&1; then
              echo "Frontend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to become ready"
          cat frontend.log
          exit 1
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run Playwright e2e suite
        run: pnpm exec playwright test
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e-report/
            e2e-shots/
            test-results/
          retention-days: 7

  mobile-e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: polycheck_test
          POSTGRES_USER: polycheck
          POSTGRES_PASSWORD: polycheck-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polycheck -d polycheck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://polycheck:polycheck-test-password@localhost:5432/polycheck_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      TRUST_PROXY: "false"
      STORAGE_DRIVER: local
      UPLOAD_DIR: /tmp/polycheck-mobile-e2e-uploads
      SEED_PASSWORD: PolycheckLocal1!
      PORT: "4000"
      EXPO_PUBLIC_API_URL: http://10.0.2.2:4000/api
      EXPO_PUBLIC_ALLOW_QR_FALLBACKS: "true"
      EXPO_PUBLIC_E2E_MODE: "true"
      LOGIN_RATE_LIMIT: "100"
      LOGIN_IP_RATE_LIMIT: "500"
      API_RATE_LIMIT: "1000"
      API_RATE_WINDOW_SECONDS: "60"
      EXPO_NO_GIT_STATUS: "1"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @polycheck/backend prisma:generate
      - run: pnpm --filter @polycheck/backend prisma:migrate:deploy
      - run: pnpm --filter @polycheck/backend prisma:seed
      - run: pnpm --filter @polycheck/backend build
      - name: Start backend
        run: |
          node backend/dist/main.js > backend.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:4000/api/health/ready > /dev/null 2>&1; then
              echo "Backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to become ready"
          cat backend.log
          exit 1
      - name: Generate Android native project
        run: pnpm --dir android exec expo prebuild --platform android --no-install --clean
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android E2E APK
        run: android/android/gradlew -p android/android :app:assembleDebug --no-daemon
      - name: Validate Android release APK and 16 KiB page alignment
        run: |
          android/android/gradlew -p android/android :app:assembleRelease --no-daemon
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 android/android/app/build/outputs/apk/release/app-release.apk
      - name: Install Maestro CLI
        env:
          MAESTRO_VERSION: 2.4.0
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Start Expo Metro server
        run: |
          CI=1 pnpm --dir android exec expo start --port 8081 > metro.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8081/status > /dev/null 2>&1; then
              echo "Metro ready"
              exit 0
            fi
            sleep 2
          done
          echo "Metro failed to become ready"
          cat metro.log
          exit 1
      - name: Run Android E2E suite
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb reverse tcp:8081 tcp:8081
            adb install -r android/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test --format junit --output mobile-e2e-report.xml --test-output-dir mobile-e2e-artifacts android/maestro/flows
      - name: Upload mobile E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-results
          path: |
            mobile-e2e-report.xml
            mobile-e2e-artifacts/
            backend.log
            metro.log
          if-no-files-found: warn
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose topology
        env:
          POSTGRES_PASSWORD: compose-validation-only
          REDIS_PASSWORD: compose-validation-only
          DATABASE_URL: postgresql://polycheck:compose-validation-only@pgbouncer:5432/polycheck?schema=public&pgbouncer=true&connection_limit=10&pool_timeout=10
          DIRECT_DATABASE_URL: postgresql://polycheck:compose-validation-only@postgres:5432/polycheck?schema=public&connection_limit=2&pool_timeout=30
          REDIS_URL: redis://:compose-validation-only@redis:6379/0
          BETTER_AUTH_SECRET: compose-validation-only-secret-at-least-32-characters
          METRICS_TOKEN: compose-validation-only-metrics-token-at-least-32-characters
          BETTER_AUTH_URL: https://polycheck.example.test
          CORS_ORIGINS: https://polycheck.example.test
          FRONTEND_URL: https://polycheck.example.test
          NEXT_PUBLIC_API_URL: /api
          S3_BUCKET: compose-validation-only
          PRIVACY_NOTICE_VERSION: 2026-08-04
          PRIVACY_NOTICE_URL: https://polycheck.example.test/privacy
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f deployment/docker-compose.scale.yml config --quiet
      - name: Validate nginx configuration
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE/deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginxinc/nginx-unprivileged:1.28-alpine nginx -t
      - name: Validate Prometheus configuration and rules
        env:
          METRICS_TOKEN: prometheus-validation-only-token-at-least-32-characters
        run: |
          mkdir -p "$RUNNER_TEMP/polycheck-prometheus-secrets"
          printf '%s' "$METRICS_TOKEN" > "$RUNNER_TEMP/polycheck-prometheus-secrets/metrics_token"
          docker run --rm --entrypoint promtool \
            -v "$GITHUB_WORKSPACE/deployment/monitoring:/etc/prometheus:ro" \
            -v "$RUNNER_TEMP/polycheck-prometheus-secrets:/run/secrets:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "$GITHUB_WORKSPACE/deployment/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check rules /etc/prometheus/alerts.yml
          docker run --rm --entrypoint amtool \
            -v "$GITHUB_WORKSPACE/deployment/monitoring/alertmanager.yml.example:/etc/alertmanager/config.yml:ro" \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/config.yml
      - uses: grafana/setup-k6-action@v1
      - name: Validate k6 attendance test
        run: |
          k6 inspect performance/attendance-load.js
          k6 inspect --env K6_PROFILE=full performance/attendance-load.js
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          load: true
          tags: polycheck-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          load: true
          tags: polycheck-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.test/api
            NEXT_PUBLIC_ALLOW_QR_FALLBACKS=false
            NEXT_PUBLIC_PRIVACY_NOTICE_VERSION=2026-08-04
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: polycheck-backend:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: polycheck-frontend:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
