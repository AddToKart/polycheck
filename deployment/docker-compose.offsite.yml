# Include with the base Compose file; initialize the repository once before up.
services:
  offsite-backup:
    image: restic/restic:0.18.1
    restart: unless-stopped
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [sh, /offsite-backup.sh]
    command: [schedule]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set a remote offsite repository}
      AWS_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:?Set offsite storage credentials}
      AWS_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:?Set offsite storage credentials}
      AWS_DEFAULT_REGION: ${OFFSITE_REGION:-us-east-1}
      OFFSITE_INTERVAL_SECONDS: ${OFFSITE_INTERVAL_SECONDS:-300}
      OFFSITE_MAX_AGE_SECONDS: ${OFFSITE_MAX_AGE_SECONDS:-900}
    secrets: [restic_password]
    volumes:
      - ./deployment/scripts/offsite-backup.sh:/offsite-backup.sh:ro
      - type: bind
        source: ${POSTGRES_BACKUP_PATH:?Set backup directory}
        target: /backups
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${POSTGRES_WAL_ARCHIVE_PATH:?Set WAL directory}
        target: /wal-archive
        read_only: true
        bind: { create_host_path: false }
    tmpfs:
      - /tmp:size=256m,uid=70,gid=70,mode=0700
      - /state:size=1m,uid=70,gid=70,mode=0700
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD, sh, /offsite-backup.sh, healthcheck]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 15m
secrets:
  restic_password:
    environment: RESTIC_PASSWORD
