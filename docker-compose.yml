name: polycheck

x-read-only-service: &read-only-service
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [alerting]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --storage.path=/alertmanager
    volumes:
      - ${ALERTMANAGER_CONFIG_PATH:-./deployment/monitoring/alertmanager.yml.example}:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - monitoring
    <<: *read-only-service
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    mem_limit: ${ALERTMANAGER_MEMORY_LIMIT:-256m}
    cpus: ${ALERTMANAGER_CPU_LIMIT:-0.25}
    pids_limit: 128

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      org.polycheck.recovery.mode: physical-base-backup-and-wal-archive
      org.polycheck.recovery.rpo-minutes: ${PITR_RPO_MINUTES:?PITR_RPO_MINUTES is required}
      org.polycheck.recovery.rto-minutes: ${PITR_RTO_MINUTES:?PITR_RTO_MINUTES is required}
    environment:
      POSTGRES_DB: polycheck
      POSTGRES_USER: polycheck
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      WAL_MIN_FREE_KB: ${WAL_MIN_FREE_KB:-524288}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT_SECONDS:-300}
      - -c
      - archive_command=sh /usr/local/bin/archive-wal.sh %p %f
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deployment/scripts/archive-wal.sh:/usr/local/bin/archive-wal.sh:ro
      - ./deployment/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - type: bind
        source: ${POSTGRES_WAL_ARCHIVE_PATH:?POSTGRES_WAL_ARCHIVE_PATH must be a protected external absolute directory}
        target: /wal-archive
        bind:
          create_host_path: false
    secrets:
      - postgres_password
    networks:
      - data
    shm_size: ${POSTGRES_SHM_SIZE:-256mb}
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "export PGPASSWORD=\"$$(cat /run/secrets/postgres_password)\" && test \"$$(stat -c %a /wal-archive)\" = 700 && test \"$$(psql -U polycheck -d polycheck -Atqc 'SHOW archive_mode')\" = on && psql -U polycheck -d polycheck -Atqc \"SELECT CASE WHEN (archived_count = 0 AND failed_count = 0) OR (last_archived_time IS NOT NULL AND (last_failed_time IS NULL OR last_archived_time >= last_failed_time)) THEN 1 ELSE 0 END FROM pg_stat_archiver\" | grep -qx 1 && pg_isready -U polycheck -d polycheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  provision-roles:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: polycheck
      PGUSER: polycheck
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?Set a separate runtime password}
      MIGRATOR_DATABASE_PASSWORD: ${MIGRATOR_DATABASE_PASSWORD:?Set a separate migrator password}
      BACKUP_DATABASE_PASSWORD: ${BACKUP_DATABASE_PASSWORD:?Set a separate backup password}
    entrypoint: ["sh", "/provision-database-roles.sh"]
    volumes:
      - ./deployment/scripts/provision-database-roles.sh:/provision-database-roles.sh:ro
      - ./deployment/postgres/provision-roles.sql:/provision-roles.sql:ro
    secrets: [postgres_password]
    networks: [data]
    <<: *read-only-service

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    depends_on:
      provision-roles:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: polycheck
      DB_USER: polycheck_runtime
      DB_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?RUNTIME_DATABASE_PASSWORD is required}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-2000}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-50}
      MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-10}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-10}
      SERVER_IDLE_TIMEOUT: ${PGBOUNCER_SERVER_IDLE_TIMEOUT:-600}
      SERVER_RESET_QUERY: DISCARD ALL
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    mem_limit: ${PGBOUNCER_MEMORY_LIMIT:-256m}
    cpus: ${PGBOUNCER_CPU_LIMIT:-1.0}
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${DB_PASSWORD}\" psql -h 127.0.0.1 -p 5432 -U polycheck_runtime -d polycheck -Atqc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-768mb}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory "$${REDIS_MAXMEMORY}" --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${REDIS_MEMORY_LIMIT:-1g}
    cpus: ${REDIS_CPU_LIMIT:-1.0}
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable sha tag or digest reference}
    restart: "no"
    depends_on:
      provision-roles:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DIRECT_DATABASE_URL:?DIRECT_DATABASE_URL is required for migrations}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:?DIRECT_DATABASE_URL is required for migrations}
    command: ["sh", "docker-entrypoint.sh", "migrate"]
    networks:
      - data
    <<: *read-only-service
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    mem_limit: ${MIGRATION_MEMORY_LIMIT:-512m}
    cpus: ${MIGRATION_CPU_LIMIT:-1.0}
    pids_limit: 128

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable sha tag or digest reference}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required and must target PgBouncer with connection_limit and pool_timeout}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be at least 32 characters}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      MAX_PROOF_BYTES: ${MAX_PROOF_BYTES:-5000000}
      STORAGE_DRIVER: s3
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      PRIVACY_NOTICE_VERSION: ${PRIVACY_NOTICE_VERSION:?PRIVACY_NOTICE_VERSION is required}
      PRIVACY_NOTICE_URL: ${PRIVACY_NOTICE_URL:?PRIVACY_NOTICE_URL is required}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-2555}
      DENIED_SCAN_RETENTION_DAYS: ${DENIED_SCAN_RETENTION_DAYS:-90}
    networks:
      - edge
      - data
      - monitoring
    stop_grace_period: 40s
    <<: *read-only-service
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    cpus: ${BACKEND_CPU_LIMIT:-1.0}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be an immutable sha tag or digest reference}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      SENTRY_DSN: ${SENTRY_DSN:-}
    networks:
      - edge
    <<: *read-only-service
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /app/frontend/.next/cache:size=128m,noexec,nosuid,nodev
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}
    cpus: ${FRONTEND_CPU_LIMIT:-1.0}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      provision-roles:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: polycheck
      PGUSER: polycheck_backup
      POSTGRES_PASSWORD_FILE: /run/secrets/backup_database_password
      BACKUP_DIR: /backups
      WAL_ARCHIVE_DIR: /wal-archive
      WAL_MIN_FREE_KB: ${WAL_MIN_FREE_KB:-524288}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BASE_BACKUP_INTERVAL_DAYS: ${BASE_BACKUP_INTERVAL_DAYS:-7}
      BASE_BACKUP_RETENTION_DAYS: ${BASE_BACKUP_RETENTION_DAYS:-35}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-93600}
    entrypoint: ["sh", "/usr/local/bin/backup-postgres.sh"]
    command: ["schedule"]
    volumes:
      - ./deployment/scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - type: bind
        source: ${POSTGRES_BACKUP_PATH:?POSTGRES_BACKUP_PATH must be a protected external absolute directory}
        target: /backups
        bind:
          create_host_path: false
      - type: bind
        source: ${POSTGRES_WAL_ARCHIVE_PATH:?POSTGRES_WAL_ARCHIVE_PATH must be a protected external absolute directory}
        target: /wal-archive
        bind:
          create_host_path: false
    secrets:
      - backup_database_password
    networks:
      - data
    user: "70:70"
    <<: *read-only-service
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev,uid=70,gid=70,mode=0700
    mem_limit: ${BACKUP_MEMORY_LIMIT:-768m}
    cpus: ${BACKUP_CPU_LIMIT:-1.0}
    pids_limit: 128
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/backup-postgres.sh", "healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m

  restore-drill:
    profiles: [recovery]
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: polycheck
      PGUSER: polycheck
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      RUN_RESTORE_DRILL: ${RUN_RESTORE_DRILL:-0}
    entrypoint: ["sh", "/usr/local/bin/restore-drill.sh"]
    command: ["/backups/latest.dump"]
    volumes:
      - ./deployment/scripts/restore-drill.sh:/usr/local/bin/restore-drill.sh:ro
      - type: bind
        source: ${POSTGRES_BACKUP_PATH:?POSTGRES_BACKUP_PATH must be a protected external absolute directory}
        target: /backups
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - postgres_password
    networks:
      - data
    user: "70:70"
    <<: *read-only-service
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev,uid=70,gid=70,mode=0700
    mem_limit: ${RESTORE_DRILL_MEMORY_LIMIT:-768m}
    cpus: ${RESTORE_DRILL_CPU_LIMIT:-1.0}
    pids_limit: 128

  pitr-verify:
    profiles: [recovery]
    image: node:22-alpine
    restart: "no"
    environment:
      BACKUP_DIR: /backups
      WAL_ARCHIVE_DIR: /wal-archive
      PITR_MAX_WAL_AGE_SECONDS: ${PITR_MAX_WAL_AGE_SECONDS:-900}
      PITR_MAX_CHAIN_SEGMENTS: ${PITR_MAX_CHAIN_SEGMENTS:-1000000}
    entrypoint: ["sh", "/usr/local/bin/verify-pitr-assets.sh"]
    network_mode: none
    volumes:
      - ./deployment/scripts/verify-pitr-assets.sh:/usr/local/bin/verify-pitr-assets.sh:ro
      - ./deployment/scripts/verify-wal-chain.mjs:/usr/local/bin/verify-wal-chain.mjs:ro
      - type: bind
        source: ${POSTGRES_BACKUP_PATH:?POSTGRES_BACKUP_PATH must be a protected external absolute directory}
        target: /backups
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${POSTGRES_WAL_ARCHIVE_PATH:?POSTGRES_WAL_ARCHIVE_PATH must be a protected external absolute directory}
        target: /wal-archive
        read_only: true
        bind:
          create_host_path: false
    user: "70:70"
    <<: *read-only-service
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev,uid=70,gid=70,mode=0700
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64

  pitr-restore-drill:
    profiles: [recovery]
    image: postgres:16-alpine
    restart: "no"
    environment:
      BACKUP_DIR: /backups
      WAL_ARCHIVE_DIR: /wal-archive
      RESTORE_DATA_DIR: /restore-data
      RUN_PITR_RESTORE_DRILL: ${RUN_PITR_RESTORE_DRILL:-0}
      PITR_RECOVERY_TARGET_NAME: ${PITR_RECOVERY_TARGET_NAME:-}
      PITR_VERIFY_SQL: ${PITR_VERIFY_SQL:-}
    entrypoint: ["sh", "/usr/local/bin/pitr-restore-drill.sh"]
    network_mode: none
    volumes:
      - ./deployment/scripts/pitr-restore-drill.sh:/usr/local/bin/pitr-restore-drill.sh:ro
      - type: bind
        source: ${POSTGRES_BACKUP_PATH:?POSTGRES_BACKUP_PATH must be a protected external absolute directory}
        target: /backups
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${POSTGRES_WAL_ARCHIVE_PATH:?POSTGRES_WAL_ARCHIVE_PATH must be a protected external absolute directory}
        target: /wal-archive
        read_only: true
        bind:
          create_host_path: false
      - pitr-restore-data:/restore-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:size=64m,nosuid,nodev,uid=70,gid=70,mode=0700
    mem_limit: ${PITR_RESTORE_MEMORY_LIMIT:-1g}
    cpus: ${PITR_RESTORE_CPU_LIMIT:-1.0}
    pids_limit: 128

  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
    <<: *read-only-service
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    mem_limit: ${NGINX_MEMORY_LIMIT:-256m}
    cpus: ${NGINX_CPU_LIMIT:-1.0}
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deployment/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployment/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - metrics_token
    networks:
      - monitoring
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-512m}
    cpus: ${PROMETHEUS_CPU_LIMIT:-0.5}
    pids_limit: 128

networks:
  edge:
  data:
    internal: true
  monitoring:

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  alertmanager-data:
  pitr-restore-data:

secrets:
  backup_database_password:
    environment: BACKUP_DATABASE_PASSWORD
  metrics_token:
    environment: METRICS_TOKEN
  postgres_password:
    environment: POSTGRES_PASSWORD
