packages:
  - "shared"
  - "frontend"
  - "android"
  - "backend"
  - "services/ingest"
allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": true
  "@sentry/cli": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    # query-string@7 (via expo-router) requires decode-uri-component as CJS.
    # The only patched release (0.5.1) is ESM-only with no `require` export,
    # so the override would break Expo Router deep-link parsing. Residual risk
    # is a bounded CPU DoS from oversized percent-encoded links; no data exposure.
    - GHSA-qr28-fpjm-wq7f
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.11 || 57.0.12'
  - '@expo/inline-modules@0.1.4'
  - '@expo/local-build-cache-provider@57.0.5'
  - '@expo/log-box@57.0.2'
  - '@expo/metro-runtime@57.0.8'
  - '@expo/prebuild-config@57.0.10'
  - '@expo/ui@57.0.8 || 57.0.9'
  - babel-preset-expo@57.0.5
  - expo-asset@57.0.8
  - expo-constants@57.0.8 || 57.0.9
  - expo-image-picker@57.0.7
  - expo-location@57.0.7
  - expo-modules-core@57.0.8 || 57.0.9
  - expo-router@57.0.9 || 57.0.10
  - expo-sharing@57.0.8
  - expo@57.0.9 || 57.0.10
  - '@expo/router-server@57.0.5'
  - expo-linking@57.0.5
  - maplibre-gl@6.13.0
overrides:
  "@nestjs/swagger>js-yaml": 5.4.3
  "@xmldom/xmldom@>=0.8.0 <0.9.0": 0.8.15
  "@xmldom/xmldom@>=0.9.0 <0.10.0": 0.9.12
  "ajv>fast-uri": 3.1.8
  browserslist: 4.28.7
  compression: 1.8.2
  body-parser: 2.4.0
  deepmerge-ts: 8.0.0
  engine.io: 6.6.11
  "js-yaml@>=4.0.0 <5.0.0": 4.3.2
  lightningcss: 1.30.1
  markdown-it: 14.3.3
  "minimatch@>=10.0.0>brace-expansion": 5.0.12
  multer: 2.5.0
  mysql2: 3.23.1
  "nanoid@>=3.0.0 <4.0.0": 3.3.18
  next: 16.4.1
  "next>postcss": 8.5.25
  "next>sharp": 0.35.5
  node-forge: 1.4.1
  proxy-addr: 2.0.8
  qs: 6.16.2
  "qs@>=6.11.1 <=6.15.1": 6.16.2
  "react-devtools-core>shell-quote": 1.11.0
  "socket.io-parser@>=4.0.0 <4.2.7": 4.2.7
  source-map-js: 1.2.2
  undici: 8.12.2
  vite: 7.3.7
  vitest: 4.1.11
  "xcode>uuid": 11.1.1
