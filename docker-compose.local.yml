name: polycheck-local

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile.backend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: polycheck
      POSTGRES_USER: polycheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polycheck_local_db_2026}
    volumes:
      - local-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polycheck -d polycheck"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - local-redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: polycheck-backend-local
    build: *backend-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 4000
      # Control-plane fallback drainer for the ingestion gateway (off by default).
      INGEST_FALLBACK_DRAIN: ${INGEST_FALLBACK_DRAIN:-false}
      # Native bcrypt runs on the libuv threadpool (default 4). Size it to the box so
      # 2,000-student provisioning/logins are not serialized on one thread.
      # See plan/load-simulation-plan.md Addendum 2 (Finding F2).
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-16}
      # Local load-test headroom (see plan/load-simulation-plan.md LT3); production unchanged.
      DATABASE_URL: postgresql://polycheck:${POSTGRES_PASSWORD:-polycheck_local_db_2026}@postgres:5432/polycheck?schema=public&connection_limit=50
      REDIS_URL: redis://redis:6379/0
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-polycheck-local-better-auth-secret-2026}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      TRUST_PROXY: "false"
      UPLOAD_DIR: /app/backend/uploads
      MAX_PROOF_BYTES: ${MAX_PROOF_BYTES:-5000000}
      STORAGE_DRIVER: local
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-200}
      LOGIN_IP_RATE_LIMIT: ${LOGIN_IP_RATE_LIMIT:-1000}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-2000}
      API_RATE_WINDOW_SECONDS: ${API_RATE_WINDOW_SECONDS:-60}
      KEY_PROVISION_RATE_LIMIT: ${KEY_PROVISION_RATE_LIMIT:-200}
      KEY_PROVISION_RATE_WINDOW_SECONDS: ${KEY_PROVISION_RATE_WINDOW_SECONDS:-3600}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_KEY_ENCRYPTION_SECRET: ${AI_KEY_ENCRYPTION_SECRET:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1024}
      AI_MAX_MESSAGES_PER_DAY: ${AI_MAX_MESSAGES_PER_DAY:-100}
    volumes:
      - local-proof-uploads:/app/backend/uploads
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    image: polycheck-backend-local
    build: *backend-build
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://polycheck:${POSTGRES_PASSWORD:-polycheck_local_db_2026}@postgres:5432/polycheck?schema=public
    command: ["sh", "docker-entrypoint.sh", "migrate"]

  frontend:
    image: polycheck-frontend-local
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_ALLOW_QR_FALLBACKS: ${NEXT_PUBLIC_ALLOW_QR_FALLBACKS:-true}
        NEXT_PUBLIC_ENABLE_OUTAGE_SIMULATOR: ${NEXT_PUBLIC_ENABLE_OUTAGE_SIMULATOR:-true}
        NEXT_PUBLIC_PWA_OFFLINE: ${NEXT_PUBLIC_PWA_OFFLINE:-true}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Optional ingestion gateway (plan/fastify-ingestion-gateway-plan.md).
  #   docker compose --profile gateway up -d
  # Without the profile every request keeps going to NestJS — that is both the
  # default local developer experience and the operational rollback path.
  ingest:
    image: polycheck-ingest-local
    profiles: ["gateway"]
    build:
      context: .
      dockerfile: Dockerfile.ingest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4001
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://polycheck:${POSTGRES_PASSWORD:-polycheck_local_db_2026}@postgres:5432/polycheck?schema=public
      CONTROL_PLANE_URL: http://backend:4000/api
      INGEST_DRAINER_ENABLED: ${INGEST_DRAINER_ENABLED:-true}
      INGEST_DB_POOL_SIZE: ${INGEST_DB_POOL_SIZE:-8}
      LOG_LEVEL: info
    ports:
      - "${INGEST_PORT:-4001}:4001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  seed:
    image: polycheck-backend-local
    build: *backend-build
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://polycheck:${POSTGRES_PASSWORD:-polycheck_local_db_2026}@postgres:5432/polycheck?schema=public
      SEED_PASSWORD: ${SEED_PASSWORD:-PolycheckLocal1!}
      ALLOW_PRODUCTION_SEED: "false"
    # The production image prunes dev dependencies, so the seed is compiled to
    # plain JS (dist-seed) during the Docker build instead of using ts-node.
    command: ["node", "dist-seed/prisma/seed.js"]

volumes:
  local-postgres-data:
  local-redis-data:
  local-proof-uploads:

